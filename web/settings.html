<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置与隐私｜李兆霖数学错题本</title><link rel="icon" href="/assets/branding/favicon-v1.ico"><link rel="stylesheet" href="/web/app.css"></head>
<body class="is-authenticated" data-page="settings"><div class="app-shell">

  <main id="main" tabindex="-1"><header class="page-header"><div><p class="eyebrow">账号管理</p><h1>设置与隐私</h1></div><button id="logout" class="ghost" type="button">退出</button></header><section class="panel page-panel settings-panel"><button id="logout-all" class="ghost" type="button">退出所有设备</button><form id="sensitive-form"><p>导出或注销前，请用当前账号手机号再次验证。</p><label for="sensitive-phone">当前账号手机号</label><input id="sensitive-phone" inputmode="tel" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required><label for="sensitive-action">验证用途</label><select id="sensitive-action"><option value="export">导出个人数据</option><option value="delete">永久注销账号</option></select><div id="sensitive-captcha-fields" hidden><label for="sensitive-captcha-token">人机验证令牌</label><input id="sensitive-captcha-token" autocomplete="off" placeholder="本地测试可输入 local-captcha"></div><button id="sensitive-otp" class="ghost" type="button">获取操作验证码</button><label for="sensitive-code">操作验证码</label><input id="sensitive-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><div class="actions"><button id="export-data" class="ghost" type="button">导出个人数据</button><button id="delete-account" class="danger" type="button">永久注销账号</button></div></form><p id="settings-status" class="status" role="status" aria-live="polite"></p></section></main>
