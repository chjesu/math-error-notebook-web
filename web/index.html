<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台｜李兆霖数学错题本</title>
  <link rel="icon" href="/assets/branding/favicon-v1.ico">
  <link rel="stylesheet" href="/web/app.css">
</head>
<body class="is-authenticated" data-page="workbench">
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/" aria-label="李兆霖数学错题本首页"><img src="/assets/branding/logo-symbol-color-64-v1.png" alt=""><span>李兆霖数学错题本</span></a>
      <nav><a class="active" aria-current="page" href="/"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#workbench"></use></svg><span>工作台</span></a><a href="/errors"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#errors"></use></svg><span>错题本</span></a><a href="/reviews"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#reviews"></use></svg><span>今日复习</span></a><a href="/practice"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#practice"></use></svg><span>练习 PDF</span></a><a href="/progress"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#progress"></use></svg><span>学习进度</span></a><a href="/settings"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#settings"></use></svg><span>设置与隐私</span></a></nav>
    </aside>
    <main id="main" class="chat-main" tabindex="-1">
      <header class="page-header chat-header"><div><p class="eyebrow">个人错题本</p><h1>错题助手</h1></div></header>
      <section class="chat-workspace" aria-label="错题助手对话">
        <div id="chat-thread" class="chat-thread">
          <div class="chat-welcome"><img src="/assets/branding/logo-symbol-color-64-v1.png" alt=""><h2>今天要整理哪道错题？</h2><p>添加题目图片或试卷，我会带你逐步确认题干、作答和错误原因。</p></div>
          <p id="upload-status" class="status chat-status" role="status" aria-live="polite"></p>
          <div id="chat-stream" class="chat-stream">
            <div id="manual-flow" class="chat-turn assistant-turn manual-flow" hidden>
              <img class="chat-avatar" src="/assets/branding/logo-symbol-color-64-v1.png" alt="">
              <div class="chat-response">
                <form id="manual-intake-form"><h3>确认题干与作答</h3><p id="intake-context">先核对内容，再进入判题。</p><label for="question-text">完整题干</label><textarea id="question-text" rows="5" required></textarea><label for="answer-text">你的作答</label><textarea id="answer-text" rows="4"></textarea><button type="submit">确认题干与作答</button></form>
                <form id="manual-grade-form" hidden><h3>记录完整判题</h3><label for="verdict">结果</label><select id="verdict" required><option value="incorrect">错误</option><option value="partial">部分正确</option><option value="correct">正确</option><option value="unclear">暂时无法判断</option></select><div id="diagnosis-fields"><label for="first-error">第一处实质错误</label><textarea id="first-error" rows="3" required></textarea><label for="cause-code">主要错因</label><select id="cause-code" required><option value="">请选择</option><option value="knowledge_gap">知识点未掌握</option><option value="concept_confusion">概念理解不准确</option><option value="formula_condition">公式或定理使用条件遗漏</option><option value="method_choice">解题思路选择错误</option><option value="reasoning_gap">推理或步骤跳跃</option><option value="algebra_transform">代数变形错误</option><option value="calculation">计算错误</option><option value="misreading">审题错误</option><option value="incomplete_cases">漏解或分类不完整</option><option value="expression">表达或书写不规范</option><option value="careless">有直接证据的粗心错误</option><option value="unclear">信息不足</option></select><label for="grade-evidence">错因判断依据</label><textarea id="grade-evidence" rows="3" required></textarea><label for="correct-solution">完整正确过程</label><textarea id="correct-solution" rows="5" required></textarea><label for="final-answer">最终答案</label><textarea id="final-answer" rows="2" required></textarea><label for="prevention-cue">下次防错提示</label><textarea id="prevention-cue" rows="2"></textarea></div><button type="submit">生成候选</button></form>
                <div id="grade-confirm" hidden><p id="grade-summary"></p><button id="commit-grade" type="button">确认写入错题本</button><button id="next-intake" class="ghost" type="button" hidden>处理下一个文件</button></div><p id="manual-status" class="status" role="status" aria-live="polite"></p>
              </div>
            </div>
          </div>
        </div>
        <form id="upload-form" class="chat-composer"><div id="drop-zone" class="composer-surface"><ul id="upload-file-list" class="upload-file-list" aria-label="待上传文件"></ul><div class="composer-row"><button id="file-picker" class="attach-button" type="button" aria-label="添加附件" title="添加附件">＋</button><span class="composer-placeholder">添加图片、PDF 或 DOCX，也可直接拖放、粘贴</span><button id="upload-button" class="send-button" type="submit" aria-label="上传并录入" disabled>↑</button></div></div><input id="file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.docx" multiple></form>
        <p class="composer-note">单个文件不超过 25 MB；上传后仍需你确认内容。</p>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="移动端主导航"><a class="active" aria-current="page" href="/">工作台</a><a href="/errors">错题本</a><a href="/reviews">复习</a><a href="/practice">练习</a><a href="/settings">更多</a></nav>
  </div><script src="/web/app.js" defer></script>
</body></html>
