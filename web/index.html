<body class="is-authenticated" data-page="workbench">
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/" aria-label="李兆霖数学错题本首页"><img src="/assets/branding/logo-symbol-color-64-v1.png" alt=""><span>李兆霖数学错题本</span></a>
      <nav><a class="active" aria-current="page" href="/"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#workbench"></use></svg><span>工作台</span></a><a href="/errors"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#errors"></use></svg><span>错题本</span></a><a href="/reviews"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#reviews"></use></svg><span>今日复习</span></a><a href="/practice"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#practice"></use></svg><span>练习 PDF</span></a><a href="/progress"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#progress"></use></svg><span>学习进度</span></a><a href="/settings"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#settings"></use></svg><span>设置与隐私</span></a></nav>
    </aside>
    <main id="main" class="chat-main" tabindex="-1">
      <header class="page-header chat-header"><div><p class="eyebrow">个人错题本</p><h1>错题助手</h1></div></header>
      <section class="chat-workspace" aria-label="错题助手对话">
        <div id="chat-thread" class="chat-thread">
          <div class="chat-welcome"><img src="/assets/branding/logo-symbol-color-64-v1.png" alt=""><h2>今天要整理哪道错题？</h2><p>添加未判或已判的题目，我会陪您整理错题、分析错误原因、梳理相关知识点，并完成题目解析。</p></div>
          <p id="upload-status" class="status chat-status" role="status" aria-live="polite"></p>
          <div id="history-pagination" class="history-pagination" hidden><button id="load-older" class="history-loader" type="button">加载更早</button></div>
          <div id="chat-stream" class="chat-stream" aria-live="polite"></div>
        </div>
        <div id="conversation-dock" class="conversation-dock">
          <form id="upload-form" class="chat-composer"><div id="drop-zone" class="composer-surface"><ul id="upload-file-list" class="upload-file-list" aria-label="待上传文件"></ul><textarea id="chat-input" rows="1" maxlength="12000" placeholder="输入消息，或添加图片、PDF、DOCX" aria-label="给错题助手发消息"></textarea><div class="composer-row"><div class="composer-tools"><label id="file-picker" class="attach-button" for="file" title="添加图片或文件"><span class="attach-icon" aria-hidden="true">＋</span><span>添加图片/文件</span></label><div id="composer-actions" class="composer-actions" role="radiogroup" aria-label="选择操作"><label class="composer-action"><input type="radio" name="composer-action" value="ask" checked><span>询问</span></label></div><button id="compact-conversation" class="compact-button" type="button" hidden>整理上下文</button></div><button id="upload-button" class="send-button" type="submit" aria-label="发送" disabled>↑</button></div></div><input id="file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.docx" multiple></form>
          <p id="composer-note" class="composer-note">单个文件不超过 25 MB；上传后可直接对话修正、判题并确认入本。</p>
        </div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="移动端主导航"><a class="active" aria-current="page" href="/">工作台</a><a href="/errors">错题本</a><a href="/reviews">复习</a><a href="/practice">练习</a><a href="/settings">更多</a></nav>
