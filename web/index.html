<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工作台｜李兆霖数学错题本</title>
  <link rel="icon" href="/assets/branding/favicon-v1.ico">
  <style>
    * { box-sizing: border-box; }
    html, body, main, iframe { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f7f7f5; color: #182230; font: 16px/1.5 system-ui, sans-serif; }
    iframe { display: block; border: 0; background: #fff; }
    .harness-status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
    .harness-status[hidden] { display: none; }
    .harness-status strong { display: block; margin-bottom: 8px; }
    .harness-status p { margin: 0; color: #586474; }
  </style>
</head>
<body data-page="harness-workbench">
  <main>
    <div id="harness-status" class="harness-status" role="status" aria-live="polite">
      <div><strong>正在打开错题助手</strong><p>正在连接本地 DeepSeek Harness 工作台…</p></div>
    </div>
    <iframe id="harness-frame" title="李兆霖数学错题本工作台" allow="clipboard-read; clipboard-write" hidden></iframe>
  </main>
  <script>
    (() => {
      const frame = document.querySelector("#harness-frame");
      const status = document.querySelector("#harness-status");
      const showError = () => {
        status.hidden = false;
        status.innerHTML = "<div><strong>本地工作台暂时不可用</strong><p>请确认本地服务已使用 --enable-harness-ui 启动，然后刷新页面。</p></div>";
      };
      fetch("/v1/session", {credentials: "same-origin", headers: {Accept: "application/json"}})
        .then((response) => {
          if (response.status === 401) {
            location.replace("/login");
            return;
          }
          if (!response.ok) throw new Error("session unavailable");
          frame.addEventListener("load", () => { status.hidden = true; frame.hidden = false; }, {once: true});
          frame.src = "http://127.0.0.1:3080/";
          setTimeout(() => { if (frame.hidden) showError(); }, 10000);
        })
        .catch(showError);
    })();
  </script>
</body>
</html>
