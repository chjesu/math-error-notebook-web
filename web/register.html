<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>李兆霖数学错题本</title><link rel="icon" href="/assets/branding/favicon-v1.ico"><link rel="stylesheet" href="/web/app.css"></head>
<body data-auth-mode="register"><main id="main" tabindex="-1"><section class="auth-card" aria-labelledby="auth-title"><div class="auth-brand"><img class="auth-logo" src="/assets/branding/logo-symbol-color-128-v1.png" alt=""><span>李兆霖数学错题本</span></div><div class="auth-heading"><h1 id="auth-title">手机号注册</h1><p>设置密码并确认协议，注册后直接进入你的错题本。</p></div><div class="auth-tabs" aria-label="登录或注册"><a href="/login">登录</a><a class="active" aria-current="page" href="/register">注册</a></div><form id="phone-form"><label for="phone">手机号</label><div class="phone-row"><span aria-hidden="true">+86</span><input id="phone" name="phone" inputmode="tel" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required aria-describedby="phone-error" placeholder="请输入 11 位手机号"></div><p id="phone-error" class="field-error" role="status" hidden>手机号格式不正确</p><div id="captcha-fields" hidden><label for="captcha-token">安全验证</label><input id="captcha-token" autocomplete="off" placeholder="本地测试可输入 local-captcha"><small>系统提示后再完成验证。</small></div><button type="submit" id="otp-button" disabled>获取验证码</button></form><form id="code-form"><label for="code">验证码</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required disabled aria-describedby="code-error" placeholder="请输入 6 位验证码"><p id="code-error" class="field-error" role="status" hidden></p><label for="password">登录密码</label><div class="password-row"><input id="password" type="password" minlength="8" maxlength="20" pattern="(?=.*[A-Za-z])(?=.*[0-9])[^\s]{8,20}" autocomplete="new-password" required aria-describedby="password-error" placeholder="8—20 位，包含字母和数字"><button id="toggle-password" class="ghost" type="button" aria-label="显示密码">显示</button></div><p id="password-error" class="field-error" role="status" hidden></p><label class="check"><input id="agreement" type="checkbox" required> 我已阅读并同意 <a href="/legal/terms">用户协议</a> 和 <a href="/legal/privacy">隐私政策</a></label><button type="submit" id="auth-submit" disabled>注册并进入</button></form><p class="auth-switch">已有账号？<a href="/login">去登录</a></p><p id="auth-status" class="status" role="status" aria-live="polite"></p></section></main><script src="/web/auth.js" defer></script></body></html>
