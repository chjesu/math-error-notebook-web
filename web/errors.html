<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>错题本｜李兆霖数学错题本</title><link rel="icon" href="/assets/branding/favicon-v1.ico"><link rel="stylesheet" href="/web/app.css"></head>
<body class="is-authenticated" data-page="errors"><div class="app-shell">
  <aside class="sidebar" aria-label="主导航"><a class="brand" href="/" aria-label="返回工作台"><img src="/assets/branding/logo-symbol-color-64-v1.png" alt=""><span>李兆霖数学错题本</span></a><nav><a class="active" aria-current="page" href="/errors"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#errors"></use></svg><span>错题本</span></a><a href="/practice"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#practice"></use></svg><span>练习 PDF</span></a><a href="/progress"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#progress"></use></svg><span>学习进度</span></a><a href="/settings"><svg class="nav-icon" aria-hidden="true"><use href="/web/nav-icons.svg#settings"></use></svg><span>设置</span></a></nav></aside>
  <main id="main" tabindex="-1"><header class="page-header"><div><p class="eyebrow">个人错题本</p><h1>错题本与复习</h1><p class="page-intro">看清当前阶段，完成今天的重做与改错。</p></div><button id="refresh-errors" class="ghost" type="button">刷新数据</button></header>
    <div class="page-panel error-dashboard">
      <section class="panel today-plan-panel" aria-labelledby="today-plan-heading">
        <div class="panel-title"><div><p class="section-kicker">今日的复习计划</p><h2 id="today-plan-heading">按步骤完成</h2></div><span id="today-plan-state" class="badge">正在加载</span></div>
        <ol class="plan-steps">
          <li id="plan-step-select"><span>1</span><div><strong>选择复习题目</strong><small id="selected-error-count">待选择</small></div></li>
          <li id="plan-step-pdf"><span>2</span><div><strong>生成推荐题 PDF</strong><small id="pdf-step-state">待生成</small></div></li>
          <li id="plan-step-correct"><span>3</span><div><strong>完成重做与改错</strong><small id="correction-step-state">待开始</small></div></li>
          <li id="plan-step-done"><span>4</span><div><strong>今日复习完成</strong><small id="completion-step-state">尚未完成</small></div></li>
        </ol>
        <div class="plan-actions"><button id="generate-review-pdf" type="button" disabled>生成今日复习推荐题 PDF</button><fieldset class="mode-choice"><legend>生成模式</legend><label><input name="review-pdf-mode" type="radio" value="review" checked> 复习卷（含解析）</label><label><input name="review-pdf-mode" type="radio" value="self_test"> 自测卷（留白）</label></fieldset></div>
        <p id="today-pdf-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel all-errors-panel" aria-labelledby="all-errors-heading">
        <div class="panel-title"><div><p class="section-kicker">题目档案</p><h2 id="all-errors-heading">全部错题</h2></div><span class="selection-hint">勾选后加入今日计划，最多 12 道</span></div>
        <label class="cause-filter" for="error-cause-filter"><span>按错因筛选</span><select id="error-cause-filter"><option value="">全部错因</option><option value="knowledge_gap">知识点未掌握</option><option value="concept_confusion">概念理解不准确</option><option value="formula_condition">公式或定理使用条件遗漏</option><option value="method_choice">解题思路选择错误</option><option value="reasoning_gap">推理或步骤跳跃</option><option value="algebra_transform">代数变形错误</option><option value="calculation">计算失误</option><option value="misreading">审题错误</option><option value="incomplete_cases">分类讨论不完整</option><option value="expression">表达不规范</option><option value="careless">粗心失误</option><option value="unclear">原因待确认</option></select></label>
        <ul id="all-errors" class="error-list"><li class="empty">正在加载…</li></ul>
      </section>
      <p id="page-status" class="status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="移动端主导航"><a href="/">工作台</a><a class="active" aria-current="page" href="/errors">错题本</a><a href="/practice">练习</a><a href="/progress">进度</a><a href="/settings">更多</a></nav>
</div><script src="/web/vendor/katex/katex.min.js" defer></script><script src="/web/vendor/katex/auto-render.min.js" defer></script><script src="/web/app.js" defer></script></body></html>
